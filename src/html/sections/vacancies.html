<div class="vacancies" id="vacancies">
  <div class="container vacancies__container">
    <button class="vacancies__filter-btn">Фильтр</button>
    <section class="vacancies__filter filter">
      <h2 class="filter__title">Фильтр</h2>

      <form class="filter__form">
        <fieldset class="filter__fieldset">
          <legend class="filter__legend">Город</legend>

          <select class="filter__select" name="city" id="city">
            <option value="">Выбрать гоород</option>
          </select>
        </fieldset>

        <fieldset class="filter__fieldset">
          <legend class="filter__legend">Заработная плата</legend>

          <div class="filter__range">
            <input
              class="filter__input"
              type="number"
              name="pay-from"
              placeholder="От" />
            <input
              class="filter__input"
              type="number"
              name="pay-to"
              placeholder="До" />
          </div>
        </fieldset>

        <div class="filter__checkboxes">
          <fieldset class="filter__fieldset">
            <legend class="filter__legend">Формат</legend>

            <label class="filter__label checkbox">
              <input
                class="checkbox__input"
                type="checkbox"
                name="format"
                value="Офис" />
              Офис
            </label>

            <label class="filter__label checkbox">
              <input
                class="checkbox__input"
                type="checkbox"
                name="format"
                value="Удаленный" />
              Удаленный
            </label>

            <label class="filter__label checkbox">
              <input
                class="checkbox__input"
                type="checkbox"
                name="format"
                value="Гибкий" />
              Гибкий
            </label>
          </fieldset>

          <fieldset class="filter__fieldset">
            <legend class="filter__legend">Опыт работы</legend>

            <label class="filter__label checkbox">
              <input
                class="checkbox__input"
                type="checkbox"
                name="experience"
                value="Не важно" />
              Не важно
            </label>

            <label class="filter__label checkbox">
              <input
                class="checkbox__input"
                type="checkbox"
                name="experience"
                value="Без опыта" />
              Без опыта
            </label>

            <label class="filter__label checkbox">
              <input
                class="checkbox__input"
                type="checkbox"
                name="experience"
                value="От 1 года до 3-х лет" />
              От 1 года до 3-х лет
            </label>

            <label class="filter__label checkbox">
              <input
                class="checkbox__input"
                type="checkbox"
                name="experience"
                value="От 3-х лет" />
              От 3-х лет
            </label>
          </fieldset>

          <fieldset class="filter__fieldset">
            <legend class="filter__legend">Занятость</legend>

            <label class="filter__label checkbox">
              <input
                class="checkbox__input"
                type="checkbox"
                name="type"
                value="Полная" />
              Полная
            </label>

            <label class="filter__label checkbox">
              <input
                class="checkbox__input"
                type="checkbox"
                name="type"
                value="Частичная" />
              Частичная
            </label>

            <label class="filter__label checkbox">
              <input
                class="checkbox__input"
                type="checkbox"
                name="type"
                value="Стажировка" />
              Стажировка
            </label>

            <label class="filter__label checkbox">
              <input
                class="checkbox__input"
                type="checkbox"
                name="type"
                value="Проектная работа" />
              Проектная работа
            </label>
          </fieldset>
        </div>

        <div class="filter__buttons">
          <button class="filter__button btn btn--primary" type="button">
            Применить
          </button>
          <button class="filter__reset" type="reset">Очистить</button>
        </div>
      </form>
    </section>

    <section class="vacancies__cards cards">
      <h2 class="cards__title visually-hidden">Список вакансии</h2>

      <ul class="cards__list" id="vacancies"></ul>
    </section>
  </div>
</div>
